<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chat Ibu-Ibu</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Register Page Background */
        body {
            background-color: #e8e8ed;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Card Styling */
        .register-card {
            border-radius: 16px;
            border: none;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Logo Circle */
        .logo-circle {
            width: 44px;
            height: 44px;
            background-color: #0a5d57;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* Title Styling */
        .register-title {
            font-size: 20px;
            font-weight: 400;
            color: #2c2c2e;
            margin-bottom: 4px;
        }

        .register-subtitle {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 24px;
        }

        /* Form Labels */
        .label-text {
            font-size: 12px;
            color: #636366;
            margin-bottom: 6px;
            font-weight: 400;
        }

        /* Input Fields */
        .input-field {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            border: none !important;
            color: #2c2c2e;
        }

        .input-field:focus {
            box-shadow: 0 0 0 1px rgba(10, 93, 87, 0.3) !important;
            outline: none;
        }

        .input-field::placeholder {
            color: #a0a0a5;
        }

        /* Different background colors for inputs */
        .input-name {
            background-color: #f2f2f7 !important;
            padding-right: 36px;
        }

        .input-email {
            background-color: #e8eaf6 !important;
        }

        .input-password {
            background-color: #f2f2f7 !important;
            padding-right: 36px;
        }

        /* Input Icons */
        .input-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background-color: #c7c7cc;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-icon-eye:hover {
            background-color: #b0b0b5;
        }

        .input-icon-square {
            cursor: default;
            pointer-events: none;
        }

        .square-icon {
            width: 12px;
            height: 12px;
            border: 1px solid #8e8e93;
            border-radius: 2px;
        }

        /* Register Button */
        .btn-register {
            background-color: #0a5d57;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .btn-register:hover {
            background-color: #085048;
            color: white;
        }

        .btn-register:focus {
            box-shadow: none;
        }

        /* Login Link */
        .login-link {
            font-size: 12px;
            color: #636366;
        }

        .login-link-anchor {
            color: #0a5d57;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link-anchor:hover {
            color: #085048;
            text-decoration: underline;
        }

        /* Eye icon SVG */
        .eye-icon {
            width: 11px;
            height: 11px;
            stroke: #636366;
            stroke-width: 2.5;
            fill: none;
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .register-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card register-card shadow-sm">
                    <div class="card-body p-4">
                        <!-- Logo/Icon -->
                        <div class="text-center mb-3">
                            <div class="logo-circle">
                                <!-- Message Circle Icon (SVG) -->
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- Title -->
                        <h1 class="register-title text-center mb-1">
                            Chat Ibu-Ibu
                        </h1>
                        <p class="register-subtitle text-center mb-4">
                            Buat akun baru
                        </p>

                        <!-- Form -->
                        <form id="registerForm">
                            <!-- Nama Field -->
                            <div class="mb-3">
                                <label for="name" class="form-label label-text">
                                    Nama
                                </label>
                                <div class="position-relative">
                                    <input
                                        type="text"
                                        class="form-control input-field input-name"
                                        id="name"
                                        name="name"
                                        placeholder="masukkan nama Anda"
                                        required
                                    >
                                    <div class="input-icon input-icon-square">
                                        <div class="square-icon"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label label-text">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    class="form-control input-field input-email"
                                    id="email"
                                    name="email"
                                    placeholder="siti@example.com"
                                    required
                                >
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label label-text">
                                    Password
                                </label>
                                <div class="position-relative">
                                    <input
                                        type="password"
                                        class="form-control input-field input-password"
                                        id="password"
                                        name="password"
                                        placeholder="••••••••••"
                                        required
                                    >
                                    <button
                                        type="button"
                                        class="input-icon input-icon-eye"
                                        onclick="togglePassword('password', 'eyeIconPassword')"
                                    >
                                        <!-- Eye Icon -->
                                        <svg id="eyeIconPassword" class="eye-icon" viewBox="0 0 24 24">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label label-text">
                                    Konfirmasi Password
                                </label>
                                <div class="position-relative">
                                    <input
                                        type="password"
                                        class="form-control input-field input-password"
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        placeholder="Ulangi password Anda"
                                        required
                                    >
                                    <button
                                        type="button"
                                        class="input-icon input-icon-eye"
                                        onclick="togglePassword('confirmPassword', 'eyeIconConfirm')"
                                    >
                                        <!-- Eye Icon -->
                                        <svg id="eyeIconConfirm" class="eye-icon" viewBox="0 0 24 24">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button
                                type="submit"
                                class="btn btn-register w-100 mt-3"
                            >
                                Daftar
                            </button>
                        </form>

                        <!-- Login Link -->
                        <p class="text-center login-link mt-3 mb-0">
                            Sudah punya akun?
                            <a href="/login" class="login-link-anchor">
                                Login di sini
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for better UX) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Toggle password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                // Change to eye-off icon
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                // Change back to eye icon
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            // Validate password match
            if (formData.password !== formData.confirmPassword) {
                alert('Password tidak cocok!');
                return;
            }

            // TODO: Implement registration logic here
            console.log('Form Data:', formData);
            alert('Registrasi berhasil! (Demo)');
        });
    </script>
</body>
</html>
